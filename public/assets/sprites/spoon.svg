<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="32" viewBox="0 0 128 32" shape-rendering="crispEdges">
  <!-- 4 frames: each 32x32. Simple pixel-art style placeholder -->
  <rect x="0" y="0" width="32" height="32" fill="#1f2937" />
  <g transform="translate(0,0)">
    <rect x="6" y="6" width="20" height="10" rx="5" fill="#FFD700" stroke="#DAA520" stroke-width="1"/>
    <rect x="14" y="14" width="4" height="10" fill="#DAA520" rx="1"/>
    <circle cx="12" cy="12" r="1.5" fill="#000" />
    <circle cx="20" cy="12" r="1.5" fill="#000" />
  </g>

  <rect x="32" y="0" width="32" height="32" fill="#111827" />
  <g transform="translate(32,0)">
    <!-- slight bob (idle2) -->
    <rect x="6" y="8" width="20" height="10" rx="5" fill="#FFD700" stroke="#DAA520" stroke-width="1"/>
    <rect x="14" y="16" width="4" height="10" fill="#DAA520" rx="1"/>
    <rect x="12" y="11" width="2" height="1" fill="#000" />
    <rect x="18" y="11" width="2" height="1" fill="#000" />
  </g>

  <rect x="64" y="0" width="32" height="32" fill="#0f172a" />
  <g transform="translate(64,0)">
    <!-- catch frame -->
    <rect x="6" y="5" width="20" height="12" rx="5" fill="#FFD700" stroke="#FFFACD" stroke-width="0.5"/>
    <rect x="14" y="16" width="4" height="10" fill="#DAA520" rx="1"/>
    <circle cx="16" cy="13" r="2" fill="#000" />
  </g>

  <rect x="96" y="0" width="32" height="32" fill="#0b1220" />
  <g transform="translate(96,0)">
    <!-- hurt frame -->
    <rect x="6" y="6" width="20" height="10" rx="5" fill="#FFD700" stroke="#8B6914" stroke-width="1"/>
    <rect x="14" y="16" width="4" height="10" fill="#DAA520" rx="1"/>
    <path d="M10 9 L14 13 M22 9 L18 13" stroke="#000" stroke-width="1.2"/>
  </g>
</svg>